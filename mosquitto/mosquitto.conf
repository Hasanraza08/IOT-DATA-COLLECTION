# Mosquitto MQTT broker configuration (development setup)

# Listen for MQTT clients on the standard port.
listener 1883 0.0.0.0

# Allow clients without a username/password.
# Fine for a local demo; in production you would set allow_anonymous false,
# add a password_file and enable TLS on port 8883.
allow_anonymous true

# Keep queued messages and retained messages on disk so a broker restart
# doesn't lose data that the ingestor hasn't picked up yet.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
